services:
  - type: web
    name: biteq-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: biteq-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CANTEEN_DB
        value: /var/data/canteen.db
      - key: CORS_ORIGINS
        sync: false
